        - text: gold
          label: 금색
          description: 금빛이 도는 색상입니다.
        - text: silver
          label: 은색
          description: 은빛이 도는 색상입니다.
        - section: 소재/패턴
        - text: leather
          label: 가죽
          description: 기존 하의/외투 색상 카테고리에 있던 가죽 선택값입니다.
        - text: jean
          label: 데님
          description: 기존 하의/외투 색상 카테고리에 있던 데님 선택값입니다.
        - text: plaid
          label: 체크
          description: 기존 상의/하의/외투 색상 카테고리의 체크 선택값을 보존합니다.
        - text: striped
          label: 스트라이프
          description: 줄무늬 패턴입니다.
        - text: polka_dot
          label: 도트
          description: 점무늬 패턴입니다.
        - text: argyle
          label: 아가일
          description: 마름모 격자 형태의 아가일 패턴입니다.
        - text: checkered
          label: 체커
          description: 바둑판처럼 반복되는 체크 패턴입니다.
        - text: ribbed
          label: 골지
          description: 세로 골이 있는 니트/골지 질감입니다.
        - text: floral_print
          label: 플로럴
          description: 꽃무늬 패턴입니다.
  attributeBoards:
    clothingColors:
      label: 의상 색상
      uiGroup: 색상
      targets:
        top:
          label: 상의
          placeholder: <TCO>
          compose:
            separator: ','
          attributes:
            color:
              label: 색상
              source: colors
              mode: multiple
              migrateFrom: 상의색상
        bottom:
          label: 하의
          placeholder: <BCO>
          compose:
            separator: ','
          attributes:
            color:
              label: 색상
              source: colors
              mode: multiple
              migrateFrom: 하의색상
        outer:
          label: 외투
          placeholder: <OCO>
          compose:
            separator: ','
          attributes:
            color:
              label: 색상
              source: colors
              mode: multiple
              migrateFrom: 외투색상
일반:
  placeholder: <INTER>
  uiGroup: 구도
  tags:
    - section: 인원
    - text: solo, solo_focus
      label: 솔로
      description: 한 명의 캐릭터가 화면에 등장합니다.
    - section: 기본 자세
    - text: standing
      label: 서 있음
      description: 캐릭터가 똑바로 서 있는 자세입니다.
    - text: sit
      label: 앉음
      description: 캐릭터가 앉아 있는 자세입니다.
    - text: lying
      label: 누워 있음
      description: 바닥이나 평평한 곳에 몸을 뉘어 있는 상태입니다.
구도:
  placeholder: <INTER>
  uiGroup: 구도
  tags:
    - section: 관계
    - text: hetero
      label: 이성애
      description: 남성과 여성이 함께 등장하는 구성입니다.
    - section: 남성 수
    - text: 1boy
      label: 남성 1명
      description: 화면에 남성 캐릭터가 한 명 등장합니다.
    - text: 2boys
      label: 남성 2명
      description: 남성 캐릭터가 2명 등장하는 수량 태그
    - text: 3boys
      label: 남성 3명
      description: 남성 캐릭터가 3명 등장하는 수량 태그
    - text: 4boys
      label: 남성 4명
      description: 남성 캐릭터가 4명 등장하는 수량 태그
    - text: 6+boys
      label: 남성 6명 이상
      description: 남성 캐릭터가 6명 이상 등장하는 수량 태그
포즈:
  placeholder: <GIRL_POS>
  uiGroup: 구도
  tags:
    - section: 카메라/방향
    - text: top-down_bottom-up
      label: 상하 시점
      description: 위에서 아래를 내려다보거나 아래에서 위를 올려다보는 시점입니다.
    - text: face-to-face
      label: 대면
      description: 서로 얼굴을 마주 보고 있는 상태를 나타냅니다.
    - text: lying upside-down, head_back
      label: 거꾸로 누운
      description: 머리가 뒤를 향하도록 거꾸로 누워 있는 자세입니다.
    - text: upside-down
      label: 상하 반전
      description: 몸이 위아래로 뒤집힌 상태의 자세입니다.
    - text: dynamic_pose
      label: 역동적 포즈
      description: 동적인 움직임이 느껴지는 자세입니다.
    - section: 상체/몸 접힘
    - text: folded
      label: 접힌 자세
      description: 신체를 굽히거나 접은 상태의 포즈입니다.
    - text: knees_to_chest
      label: 무릎을 가슴으로
      description: 양 무릎을 가슴 쪽으로 끌어당긴 포즈입니다.
    - text: legs_over_head
      label: 다리를 머리 위로
      description: 다리를 머리 너머로 높게 올린 포즈입니다.
    - text: legs_up
      label: 다리 올림
      description: 다리를 공중으로 들어 올린 포즈입니다.
    - section: 앉기/걸터앉기
    - text: amazon_position
      label: 아마존
      description: 여성이 남성의 몸 위에 올라타 다리를 벌리고 주도하는 자세입니다.
    - text: reverse_upright_straddle
      label: 역방향 스트래들
      description: 등을 돌린 채 상대의 몸 위에 올라앉은 자세입니다.
    - text: upright_straddle
      label: 스트래들
      description: 상대방을 마주 보고 다리를 벌려 걸터앉은 자세입니다.
    - text: anvil_position
      label: 앤빌
      description: 여성이 바닥에 누워 엉덩이를 높게 치켜든 자세입니다.
    - text: sitting_on_lap
      label: 무릎 위에 앉기
      description: 상대방의 무릎 위에 앉아 있는 자세입니다.
    - section: 특수 포즈
    - text: all_fours
      label: 네발 자세
      description: 손과 무릎을 바닥에 대고 엎드린 자세입니다.
    - text: (sandwiched:1.4)
      label: 샌드위치
      description: 캐릭터가 양옆에서 끼여 있는 상태를 나타냅니다.
구도_확장:
  placeholder: <GIRL_POS>
  uiGroup: 구도
  tags:
    - section: 상체 방향
    - text: arched_back
      label: 아치형 허리
      description: 등과 허리를 활처럼 뒤로 굽힌 자세입니다.
    - text: leaning_back
      label: 뒤로 기울이기
      description: 몸을 뒤쪽으로 기울인 자세입니다.
    - text: bent_over
      label: 몸을 숙임
      description: 허리를 굽혀 상체를 앞으로 숙인 자세를 나타냅니다.
    - section: 다리 구도
    - text: knees_up
      label: 무릎 세움
      description: 무릎을 세워 들어 올린 자세입니다.
    - text: leg_lock
      label: 다리 잠금
      description: 상대의 허리나 몸을 다리로 감싸 안아 고정한 자세입니다.
    - text: between_legs
      label: 다리 사이
      description: 벌어진 다리 사이에 위치한 구도입니다.
    - text: spread_legs
      label: 다리 벌림
      description: 다리를 벌리고 있는 자세를 나타냅니다.
    - section: 복합 구도
    - text: peeking over dog's shoulder spread_legs
      label: 어깨 너머/다리 벌림
      description: 상대방의 어깨 너머로 얼굴을 내밀며 다리를 벌리고 있는 모습입니다.
얼굴:
  placeholder: <GIRL_FACE>
  uiGroup: 캐릭터
  tags:
    - section: 기본 얼굴
    - text: beautiful korean woman, asian woman, beautiful face, perfect face, detailed face, detailed eyes
      label: 미녀
      description: 매우 아름답고 정교하게 묘사된 아시아 여성의 얼굴입니다.
    - text: elven_beauty, pointed_ears
      label: 엘프
      description: 엘프 귀
    - section: 시선
    - text: looking_at_viewer
      label: 시선 맞춤
      description: 캐릭터가 관찰자를 정면으로 바라보고 있습니다.
    - text: looking_at_another
      label: 다른 곳 응시
      description: 캐릭터가 관찰자가 아닌 다른 곳을 바라보고 있습니다.
    - text: looking_at_away
      label: 시선 회피
      description: 시선을 정면이 아닌 다른 곳으로 향한 모습입니다.
    - section: 감정/표정
    - text: moaning
      label: 신음
      description: 입을 벌려 소리를 내는 듯한 표정입니다.
    - text: ahegao
      label: 아헤가오
      description: 쾌감으로 인해 눈이 위로 풀리고 혀를 내민 표정입니다.
    - text: crying
      label: 울음
      description: 눈물을 흘리며 우는 표정입니다.
    - text: scared
      label: 겁먹은
      description: 두려움이나 공포를 느끼는 표정
    - text: seduce
      label: 유혹
      description: 상대를 유혹하는 듯한 표정이나 분위기
    - text: seductive_smile
      label: 유혹적인 미소
      description: 상대를 유혹하듯 짓는 매력적인 미소입니다.
    - text: drooling, saliva
      label: 침 흘림
      description: 입가에서 침이나 타액이 흘러나오는 모습입니다.
    - text: blushing
      label: 홍조
      description: 수줍음이나 흥분으로 얼굴이 붉어진 상태입니다.
    - text: heavy breathing
      label: 거친 호흡
      description: 입을 벌리고 가쁘게 숨을 몰아쉬는 모습입니다.
    - text: mind_break
      label: 멘탈 브레이크
      description: 쾌락으로 인해 이성을 잃고 정신이 붕괴된 표정을 나타냅니다.
    - section: 눈/메이크업
    - text: black eyes
      label: 검은 눈
      description: 검은색 눈동자를 가진 눈
    - text: brown eyes
      label: 갈색 눈
      description: 갈색 눈동자를 가진 눈
    - text: mole under eye
      label: 눈 밑 점
      description: 눈 아래에 위치한 점을 나타냅니다.
    - text: heavy black eyeliner and smoky eyeshadow, glossy plump lips
      label: 스모키 메이크업
      description: 진한 아이라인, 스모키한 아이섀도우와 윤기 있고 도톰한 입술을 나타냅니다.
    - text: runny_makeup
      label: 망가진화장
      description: 눈물, 땀, 빗물 등에 의해 마스카라나 아이라이너 등이 번지거나 흘러내려 지저분하게 망가진 화장
헤어:
  placeholder: <HAIR>
  uiGroup: 캐릭터
  tags:
    - section: 길이/컷
    - text: <HCO>_hair
      label: 머리색
      description: 캐릭터의 머리카락 색상을 설정합니다.
    - text: short hair
      label: 숏 헤어
      description: 짧은 머리 스타일을 적용합니다.
    - text: medium hair
      label: 미디엄 헤어
      description: 중간 길이의 머리 스타일을 적용합니다.
    - text: shoulder-length hair
      label: 어깨 길이 머리
      description: 어깨까지 내려오는 길이의 머리 스타일을 적용합니다.
    - text: long hair
      label: 긴 머리
      description: 머리카락이 어깨 아래로 길게 내려온 상태를 나타냅니다.
    - text: very long hair
      label: 초장발
      description: 머리카락이 매우 길게 늘어진 상태를 나타냅니다.
    - text: bob cut
      label: 단발
      description: 턱선 정도 길이의 짧은 머리 스타일을 나타냅니다.
    - text: blunt bob
      label: 칼단발
      description: 머리 끝단이 일직선으로 똑바르게 잘린 단발 스타일을 나타냅니다.
    - text: pixie cut
      label: 픽시컷
      description: 머리카락을 아주 짧게 다듬은 숏 헤어 스타일입니다.
    - text: hime cut
      label: 히메컷
      description: 옆머리를 일자로 뱅처럼 자른 스타일입니다.
    - text: wolf cut
      label: 울프컷
      description: 층을 많이 내어 뒷머리가 길고 거친 느낌을 주는 스타일입니다.
    - text: long layered hair
      label: 레이어드 롱
      description: 층을 낸 긴 머리 스타일입니다.
    - text: side-swept hair
      label: 옆으로 넘긴 머리
      description: 머리카락을 한쪽 방향으로 쓸어 넘긴 스타일입니다.
    - text: long side-swept hair
      label: 긴 옆넘김 머리
      description: 긴 머리카락을 한쪽으로 넘긴 스타일입니다.
    - section: 앞머리/옆머리
    - text: blunt bangs
      label: 일자 앞머리
      description: 앞머리를 일직선으로 자른 스타일입니다.
    - text: parted bangs
      label: 갈라진 앞머리
      description: 가르마로 인해 앞머리가 양옆으로 갈라진 스타일입니다.
    - text: swept bangs, side-swept bangs
      label: 쓸어 넘긴 앞머리
      description: 앞머리를 옆으로 쓸어 넘긴 스타일입니다.
    - text: see-through bangs
      label: 시스루 앞머리
      description: 이마가 보이는 숱이 적은 앞머리입니다.
    - text: curtain bangs
      label: 커튼 앞머리
      description: 가운데가 갈라져 양옆으로 흐르는 앞머리입니다.
    - text: curled bangs
      label: 곱슬 앞머리
      description: 웨이브나 컬이 들어간 앞머리입니다.
    - text: hair between eyes
      label: 눈 사이 앞머리
      description: 앞머리가 미간 사이로 내려와 있는 상태를 나타냅니다.
    - text: hair strands between eyes
      label: 눈 사이 머리카락 가닥
      description: 앞머리 사이로 몇 가닥의 머리카락이 눈 사이로 흘러내린 스타일입니다.
    - text: braided bangs
      label: 땋은 앞머리
      description: 앞머리 부분을 땋아서 연출한 스타일입니다.
    - text: ahoge, antenna hair
      label: 바보털
      description: 머리 위에 삐죽하게 솟아오른 더듬이 모양의 머리카락입니다.
    - text: forehead cutout
      label: 이마 노출
      description: 앞머리 가운데가 파여서 이마가 보이는 스타일입니다.
    - text: sidelocks
      label: 옆머리
      description: 얼굴 옆선을 따라 내려오는 머리카락입니다.
    - text: hime sidelocks
      label: 히메 옆머리
      description: 히메컷처럼 옆머리가 일자로 잘린 스타일입니다.
    - section: 질감/컬
    - text: straight hair
      label: 생머리
      description: 곱슬기 없이 곧게 뻗은 머리카락입니다.
    - text: silky hair
      label: 실키 헤어
      description: 매끄럽고 부드러운 머릿결 질감을 표현합니다.
    - text: shiny hair
      label: 샤이니 헤어
      description: 머리카락에 강한 광택이 흐르는 효과를 줍니다.
    - text: messy hair
