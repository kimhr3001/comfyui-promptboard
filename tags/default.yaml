          description: 빨간색 계열의 색상입니다.
        - text: green
          label: 초록색
          description: 초록색 계열의 색상입니다.
        - text: orange
          label: 주황색
          description: 주황색 계열의 색상입니다.
        - text: purple
          label: 보라색
          description: 보라색 계열의 색상입니다.
        - section: 중성/고급색
        - text: navy
